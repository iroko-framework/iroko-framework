# Automatic validation on every commit
name: Validate Vocabularies

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'assets/**'
      - 'docs/**'
      - 'index.html'
      - 'iroko.html'
      - 'iroko-*.html'
      - 'README.md'
      - 'requirements.txt'
      - 'robots.txt'
      - 'scripts/**'
      - 'sitemap.xml'
      - 'vocab/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'assets/**'
      - 'docs/**'
      - 'index.html'
      - 'iroko.html'
      - 'iroko-*.html'
      - 'README.md'
      - 'requirements.txt'
      - 'robots.txt'
      - 'scripts/**'
      - 'sitemap.xml'
      - 'vocab/**'
      
permissions:
  contents: write
  
jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install rapper
      run: sudo apt-get install -y raptor2-utils
    
    - name: Validate Turtle files
      run: bash scripts/validate_ttl.sh
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Generate site artifacts
      run: python3 scripts/build_all.py

    - name: Check generated site
      run: python3 scripts/check_site.py

    - name: Commit generated artifacts
      if: github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html docs/*.html docs/*.md vocab/*.html vocab/*.jsonld vocab/*.rdf vocab/*.nt vocab/tradition-vocab.json iroko.html iroko-*.html iroko-framework/index.html sitemap.xml robots.txt
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate site artifacts"
        git push
